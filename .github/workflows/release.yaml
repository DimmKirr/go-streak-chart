name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# The GitHub release is created first, as a draft via `git release`, and
# publishing it is what creates the tag. So by the time this runs the
# release already exists and there are no assets to attach; the tag only
# needs the shared test pipeline to run against it.
jobs:
  test:
    uses: ./.github/workflows/test.yaml
